<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>너와의 20일 — 데이트 시뮬레이션</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="title-screen" class="screen active">
  <div class="title-bg"></div>
  <div class="title-box">
    <h1>너와의 20일</h1>
    <p class="subtitle">A Dating Story</p>
    <button id="start-btn" class="main-btn">시작하기</button>
    <button id="continue-btn" class="main-btn secondary" hidden>이어하기</button>
  </div>
</div>

<div id="game-screen" class="screen">
  <div class="hud">
    <div class="hud-left">
      <span id="day-label">Day 1</span>
      <span id="scene-label">교실</span>
    </div>
    <div class="hud-right">
      <span class="heart-icon">♥</span>
      <div class="affection-bar-track">
        <div id="affection-bar-fill" class="affection-bar-fill"></div>
      </div>
      <span id="affection-value">30</span>
    </div>
  </div>

  <div id="stage" class="stage">
    <img id="char-sprite" class="char-sprite" src="" alt="유나">
  </div>

  <div id="touch-scene" class="touch-scene" hidden>
    <p class="touch-hint">화면을 톡톡 건드려봐 — 머리는 쓰다듬고, 볼은 꾹 눌러봐</p>
    <div class="touch-wrap">
      <img id="touch-sprite" class="touch-sprite" src="" alt="유나">
      <button class="hotspot hotspot-head" data-part="head" aria-label="머리 쓰다듬기"></button>
      <button class="hotspot hotspot-cheek" data-part="cheek" aria-label="볼 꾹 누르기"></button>
      <button class="hotspot hotspot-shoulder" data-part="shoulder" aria-label="어깨 톡톡"></button>
      <button class="hotspot hotspot-hand" data-part="hand" aria-label="손 잡기"></button>
      <img id="cheek-pull-overlay" class="cheek-pull-overlay" src="" alt="" hidden>
      <div id="touch-toast" class="touch-toast" hidden></div>
    </div>
    <button id="touch-continue-btn" class="main-btn touch-continue">다음으로</button>
  </div>

  <div id="dialogue-box" class="dialogue-box">
    <div id="speaker-name" class="speaker-name"></div>
    <div id="dialogue-text" class="dialogue-text"></div>
    <div id="next-indicator" class="next-indicator">▼</div>
  </div>

  <div id="choices-box" class="choices-box" hidden></div>
</div>

<div id="ending-screen" class="screen">
  <div class="ending-scroll">
    <div class="ending-header">
      <h1 id="ending-title">엔딩</h1>
      <img id="ending-sprite" class="ending-sprite" src="" alt="">
      <p id="ending-desc" class="subtitle"></p>
      <p id="ending-score" class="ending-score"></p>
    </div>
    <div class="recap-label">우리가 함께한 시간들</div>
    <div id="recap-grid" class="recap-grid"></div>
    <button id="restart-btn" class="main-btn">처음부터 다시</button>
  </div>
</div>

<script src="story.js"></script>
<script src="game.js"></script>
</body>
</html>
